services:
  - type: web
    name: expensepro-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

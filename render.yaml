services:
  - type: web
    name: expensepro-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    disk:
      name: expensepro-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
